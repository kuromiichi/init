# The main task coordinates the full feature workflow, integrates specialist
# results, performs the final clean verification, and closes the feature.
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
max_concurrent_threads_per_session = 5
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "low"
